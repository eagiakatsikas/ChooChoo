# Checks the Choo Choo server every 15 minutes. If it's down (or has lost its Network Rail
# feed for a while), this run fails, and GitHub emails you about the failed run.
name: Server check

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is Choo Choo up?
        env:
          URL: https://143-47-236-90.sslip.io
        run: |
          # Three tries a couple of minutes apart, so a restart or a blip doesn't count
          why=""
          for i in 1 2 3; do
            if s=$(curl -fsS --max-time 20 "$URL/api/status"); then
              connected=$(echo "$s" | jq -r '.feed.connected')
              mem=$(echo "$s" | jq -r '.memoryMB')
              echo "feed connected: $connected · memory: ${mem} MB"
              if [ "$connected" = "true" ]; then exit 0; fi
              err=$(echo "$s" | jq -r '.feed.lastError // "no error given"' | head -c 300)
              why="The server is up but has lost its Network Rail feed. Last error: $err"
            else
              why="The server isn't answering at all (the machine, the choochoo service, or Oracle may be down). Try: sudo systemctl restart choochoo"
            fi
            echo "$why (try $i of 3)"
            [ $i -lt 3 ] && sleep 120
          done
          # This line is what the failure email and the run's summary show
          echo "::error title=Choo Choo needs a look::$why · $URL/api/status"
          exit 1
